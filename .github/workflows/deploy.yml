name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write    # <-- tu dajemy akcjom prawo do pushowania

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3        # warto zaktualizować do v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (Frontend)
        working-directory: frontend
        run: npm ci

      - name: Build project
        working-directory: frontend
        run: npm run build

      - name: Disable Jekyll
        working-directory: frontend/dist
        run: echo "" > .nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: frontend/dist
          token: ${{ secrets.GITHUB_TOKEN }}   # <-- używamy wbudowanego
